name: Bug report
description: Something in SynapseCtrl doesn't work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Before you post, please remove server addresses, user IDs, access tokens, registration tokens, passwords and other personal info from your text and screenshots.
        Found a security problem? Please don't post it here; see [SECURITY.md](https://github.com/VoidedKN0X/SynapseCtrl/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Tell us what went wrong.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we make it happen again?
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: What should have happened instead?
  - type: input
    id: app-version
    attributes:
      label: SynapseCtrl version
      description: Tap your profile picture; the version is at the bottom of the page, under About.
      placeholder: "Profile picture > About, e.g. 1.0.2"
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and phone
      placeholder: "Android 15, Pixel 8"
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Synapse version
      description: SynapseCtrl shows it on the Overview.
      placeholder: "e.g. 1.140.0"
  - type: dropdown
    id: installed-from
    attributes:
      label: Installed from
      options:
        - GitHub Releases
        - Obtainium
        - CtrlF-Droid
        - Built it myself
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Drag images or text files here. Please remove private info first.
