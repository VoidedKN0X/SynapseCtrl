name: Feature request
description: Suggest an idea for SynapseCtrl
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like?
      description: Describe the feature or change.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help you?
  - type: textarea
    id: else
    attributes:
      label: Anything else?
      description: Screenshots, examples from other apps, links to Synapse's admin API docs.
